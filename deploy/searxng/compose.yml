name: mar-cached-search

services:
  searxng:
    container_name: mar-cached-searxng
    image: docker.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./instance.env
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:18888/
      GRANIAN_HOST: 127.0.0.1
      SEARXNG_BIND_ADDRESS: 127.0.0.1
      SEARXNG_PORT: "18888"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng/
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18888/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  searxng-data:
